name: Publish tutorials to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-wikis.txt
      - name: Install wiki build dependencies
        run: python3 -m pip install -r requirements-wikis.txt
      - name: Build static tutorials
        run: python3 scripts/build_pages.py
      - name: Validate copied wiki content and local links
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/check_wikis.py
      - name: Check whether Pages is enabled
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.get(context.repo);
            core.setOutput('enabled', String(data.has_pages));
            if (!data.has_pages) {
              core.notice('Enable GitHub Pages: Settings > Pages > Source > GitHub Actions. Then run this workflow again.');
            }
      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
